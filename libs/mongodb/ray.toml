# A patched copy of the MongoDB client of the raylang `db` package 0.1.0 (Apache-2.0, © the
# raylang authors): bson.ray + mongo.ray. The only change is BSON int32 support, used for the
# SCRAM `saslContinue.conversationId` — MongoDB 6+ (verified up to 8.3) reject it as int64 ("BSON field
# 'saslContinue.conversationId' is the wrong type 'long', expected type 'int'"), so the upstream
# driver cannot authenticate against them. Drop this package once `db` ships the fix
# (RAYLANG-FINDINGS in ray-apps).
[package]
name = "mongodb"
version = "0.1.0"
license = "Apache-2.0"
entry = "mongo.ray"

[dependencies]
net = "^0.3.5"

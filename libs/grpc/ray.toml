# gRPC over cleartext HTTP/2 (h2c, prior knowledge): a unary server and client for the
# raymart services. Imported by path (`grpc = "path:../../libs/grpc"`, plus `net`) as
# `grpc/server`, `grpc/client`, `grpc/status`.
[package]
name = "grpc"
version = "0.1.0"
raylang = "1.27.15"
entry = "server.ray"

[dependencies]
net = "^0.3.8"

# raymart: the whole system in containers. `make up` builds and starts it.
# Only the gateway (8088) and the health dashboard (8091) are published on the host; the
# databases, the queue and the services talk on the compose network only.

# The development JWT secret shared by raygate and the services (override in production).
x-jwt: &jwt
  JWT_SECRET: ${RAYMART_JWT_SECRET:-raymart-dev-secret-change-me}

x-raylang-build: &raylang-build
  context: .
  dockerfile: docker/Dockerfile
  target: runtime

services:
  # ---- infrastructure ----
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products
      POSTGRES_DB: products
    volumes: [postgres18-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products -d products"]
      interval: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    command: ["--mysql-native-password=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders
      MYSQL_USER: orders
      MYSQL_PASSWORD: orders
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/10-native-password.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uorders -porders --silent"]
      interval: 3s
      retries: 40

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo8-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/10-payments-user.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 3s
      retries: 20

  raykv:
    build:
      <<: *raylang-build
      args: { APP_REPO: "https://github.com/ray-language/raykv.git", APP_REF: "9b40c00" }
    command: ["--bind", "0.0.0.0", "--port", "7379", "--dir", "/data"]
    volumes: [raykv-data:/data]

  rayq:
    build:
      <<: *raylang-build
      args: { APP_REPO: "https://github.com/ray-language/rayq.git", APP_REF: "7bb2f82" }
    command: ["serve", "--bind", "0.0.0.0", "--port", "7450", "--dir", "/data"]
    volumes: [rayq-data:/data]

  # ---- services (hexagonal APIs) ----
  products:
    build:
      <<: *raylang-build
      args: { APP_DIR: services/products }
    environment:
      PG_HOST: postgres
      PG_USER: products
      PG_PASSWORD: products
      PG_DATABASE: products
      HTTP_PORT: "8080"
      RPC_PORT: "9000"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/app", "health"]
      interval: 3s
      retries: 20

  cart:
    build:
      <<: *raylang-build
      args: { APP_DIR: services/cart }
    environment:
      <<: *jwt
      RAYKV_HOST: raykv
      RAYKV_PORT: "7379"
      PRODUCTS_HOST: products
      PRODUCTS_RPC_PORT: "9000"
      HTTP_PORT: "8080"
      RPC_PORT: "9000"
    depends_on:
      raykv: { condition: service_started }
      products: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/app", "health"]
      interval: 3s
      retries: 20

  orders:
    build:
      <<: *raylang-build
      args: { APP_DIR: services/orders }
    environment:
      <<: *jwt
      MYSQL_HOST: mysql
      MYSQL_USER: orders
      MYSQL_PASSWORD: orders
      MYSQL_DATABASE: orders
      CART_HOST: cart
      CART_RPC_PORT: "9000"
      PRODUCTS_HOST: products
      PRODUCTS_RPC_PORT: "9000"
      PAYMENT_HOST: payment
      PAYMENT_GRPC_PORT: "9100"
      RAYQ_HOST: rayq
      RAYQ_PORT: "7450"
      HTTP_PORT: "8080"
    depends_on:
      mysql: { condition: service_healthy }
      rayq: { condition: service_started }
      cart: { condition: service_healthy }
      products: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/app", "health"]
      interval: 3s
      retries: 30

  payment:
    build:
      <<: *raylang-build
      args: { APP_DIR: services/payment }
    environment:
      <<: *jwt
      MONGO_HOST: mongo
      MONGO_USER: payments
      MONGO_PASSWORD: payments
      MONGO_DATABASE: payments
      RAYQ_HOST: rayq
      RAYQ_PORT: "7450"
      HTTP_PORT: "8080"
      GRPC_PORT: "9100"
    depends_on:
      mongo: { condition: service_healthy }
      rayq: { condition: service_started }
    healthcheck:
      test: ["CMD", "/usr/local/bin/app", "health"]
      interval: 3s
      retries: 30

  # ---- edge ----
  raygate:
    build:
      <<: *raylang-build
      args: { APP_REPO: "https://github.com/ray-language/raygate.git", APP_REF: "e94c0ce" }
    command: ["--config", "/etc/raygate/raygate.toml"]
    volumes: [./config/raygate.toml:/etc/raygate/raygate.toml:ro]
    ports: ["127.0.0.1:8088:8080"]
    depends_on:
      products: { condition: service_healthy }
      cart: { condition: service_healthy }
      orders: { condition: service_healthy }
      payment: { condition: service_healthy }

  raywatch:
    build:
      <<: *raylang-build
      args: { APP_REPO: "https://github.com/ray-language/raywatch.git", APP_REF: "a20a47c" }
    command: ["--config", "/etc/raywatch/raywatch.toml"]
    volumes:
      - ./config/raywatch.toml:/etc/raywatch/raywatch.toml:ro
      - raywatch-data:/data
    ports: ["127.0.0.1:8091:8091"]
    depends_on: [raygate]

  # ---- tools (not started by `up`; `docker compose run --rm raylogs …`) ----
  # The load generator (`make bench`): the raymart CLI as a native binary, inside the network
  # so it can reach the products service directly and its rpc port.
  bench:
    profiles: ["bench"]
    build:
      <<: *raylang-build
      args: { APP_DIR: tools/raymart }
    environment:
      RAYMART_JWT_SECRET: ${RAYMART_JWT_SECRET:-raymart-dev-secret-change-me}
      RAYMART_GATEWAY: http://raygate:8080
      RAYMART_PRODUCTS_HTTP: http://products:8080
      RAYMART_PRODUCTS_RPC: products:9000
      RAYMART_RAYQ: rayq:7450
    volumes: [./perf/results:/out]

  raylogs:
    profiles: ["tools"]
    build:
      <<: *raylang-build
      args: { APP_REPO: "https://github.com/ray-language/raylogs.git", APP_REF: "1002c71" }

volumes:
  postgres18-data:
  mysql-data:
  mongo8-data:
  raykv-data:
  rayq-data:
  raywatch-data:
